name: Build PS2 ELF

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk update && apk add --no-cache make

      - name: Build ELF
        run: |
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-executable
          path: |
            rsod.elf
